<!DOCTYPE html>
<html lang="en">
    {% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
   
      <!-- Favicon -->
  <link rel="shortcut icon" href="{% static 'assets/media/image/favicon.png' %}"/>

  <!-- Plugin styles -->
  <link rel="stylesheet" href="{% static 'vendors/bundle.css' %}" type="text/css">
    <!-- App styles -->
    <link rel="stylesheet" href="{%  static 'assets/css/app.min.css' %}" type="text/css">
<link rel="stylesheet" href="{% static 'vendors/select2/css/select2.min.css' %}" type="text/css">

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- بعد از سایر اسکریپت‌ها این خط را اضافه کنید -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body {
      direction: rtl;
      background-color: #f8f9fa;
    }
    .node circle {
      fill: #fff;
      stroke: #20c997;
      stroke-width: 3px;
      cursor: pointer;
    }
    .node text {
      font: 14px sans-serif;
      text-anchor: start;
      dominant-baseline: middle;
    }
    .link {
      fill: none;
      stroke: #d1e7dd;
      stroke-width: 2.5px;
    }
    #info-table {
      margin: 20px auto;
      max-width: 600px;
    }
    .container-fluid {
      max-width: 1200px;
    }
    
    /* استایل مخصوص Card فیلتر */
    .filter-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      margin-bottom: 30px;
      overflow: hidden;
    }
    
    .filter-card .card-header {
      background: rgba(255,255,255,0.1);
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding: 15px 20px;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
    }
    
    .filter-card .card-body {
      background: white;
      padding: 25px;
    }
    
    .filter-card .form-label {
      color: #495057;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    .filter-card .form-control {
      border: 2px solid #e9ecef;
      border-radius: 8px;
      padding: 10px 15px;
      transition: all 0.3s ease;
    }
    
    .filter-card .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    
    .filter-card .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 8px;
      padding: 10px 25px;
      font-weight: 600;
      transition: all 0.3s ease;
      width: 100%;
    }
    
    .filter-card .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    /* استایل برای بخش نمودار */
    .chart-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      padding: 20px;
      margin-bottom: 30px;
      position: relative;
    }
    
    /* استایل برای جدول اطلاعات */
    .info-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      padding: 25px;
    }
    
    /* استایل Tooltip */
    .node-tooltip {
      position: absolute;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      padding: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 1000;
      max-width: 500px;
      min-width: 400px;
      border: 2px solid #667eea;
      display: none;
    }
    
    .node-tooltip.show {
      opacity: 1;
      pointer-events: auto;
      display: block;
    }
    
    .tooltip-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 18px;
      border-radius: 10px 10px 0 0;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .tooltip-close-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 0;
      font-size: 16px;
    }
    
    .tooltip-close-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }
    
    .tooltip-body {
      padding: 15px;
      max-height: 450px;
      overflow-y: auto;
    }
    
    .tooltip-body table {
      margin: 0;
      font-size: 0.85rem;
    }
    
    .tooltip-body .table {
      margin-bottom: 0;
    }
    
    .tooltip-body th {
      background-color: #f8f9fa;
      font-weight: 600;
      padding: 8px;
    }
    
    .tooltip-body td {
      padding: 8px;
    }
    
    .tooltip-arrow {
      position: absolute;
      width: 0;
      height: 0;
      border-style: solid;
    }
    
    .tooltip-arrow.left {
      right: 100%;
      top: 50%;
      transform: translateY(-50%);
      border-width: 10px 10px 10px 0;
      border-color: transparent #667eea transparent transparent;
    }
    
    .tooltip-arrow.right {
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      border-width: 10px 0 10px 10px;
      border-color: transparent transparent transparent #667eea;
    }
    
    .tooltip-arrow.top {
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 0 10px 10px 10px;
      border-color: transparent transparent #667eea transparent;
    }
    
    .tooltip-arrow.bottom {
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 10px 0 10px;
      border-color: #667eea transparent transparent transparent;
    }
    
    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    
    .loading-overlay.active {
      display: flex;
    }
    
    .loading-content {
      text-align: center;
      color: white;
    }
    
    .loading-spinner {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border: 6px solid rgba(255, 255, 255, 0.3);
      border-top: 6px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading-text {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    .loading-subtext {
      font-size: 0.9rem;
      opacity: 0.8;
    }
    
    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    
    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }
    /* اضافه کردن این استایل به بخش CSS */
.btn-success {
    background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
    border: none;
    border-radius: 8px;
    padding: 10px 25px;
    font-weight: 600;
    transition: all 0.3s ease;
    width: 100%;
}

.btn-success:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
}

.btn-success:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}
  </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <div class="loading-text">در حال بارگذاری<span class="loading-dots"></span></div>
        <div class="loading-subtext">لطفاً منتظر بمانید</div>
      </div>
    </div>

    <div class="container-fluid">
      <!-- کنترل‌های فیلتر به صورت Card -->
      <div class="row">
        <div class="col-12">
          <div class="card filter-card">
            <div class="card-header">
              <i class="fa fa-filter me-2"></i>فیلتر اطلاعات
            </div>
            <div class="card-body">
              <form class="row g-3 align-items-end">
                <div class="col-md-8">
                  <label for="moshakhase" class="form-label">مشخصه</label>
                  <select class="form-control nakh-name" id="moshakhase"
                          data-machine-id="{{c.machine.id}}"
                          style="width: 100%;">
                  </select>
                  <input type="hidden" class="nakh-data" name="nakh_data_{{c.machine.id}}">
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-primary d-flex justify-content-center align-items-center" onclick="fetchData()">
                       
                    اعمال فیلتر                  </button>
                </div>
                <!-- این بخش را اضافه کنید -->
              <div class="col-md-2">
                <button type="button" class="btn btn-success d-flex justify-content-center align-items-center" onclick="exportToExcel()" id="exportBtn" disabled>
                  <i class="fas fa-file-excel me-2"></i>خروجی اکسل
                </button>
              </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- نمودار -->
      <div class="row">
        <div class="col-12">
          <div class="chart-container">
            <svg width="100%" height="600"></svg>
            <!-- Tooltip Container -->
            <div class="node-tooltip" id="nodeTooltip">
              <div class="tooltip-arrow"></div>
              <div class="tooltip-header">
                <span id="tooltipHeader"></span>
                <button class="tooltip-close-btn" onclick="hideTooltip()" aria-label="Close">
                  ×
                </button>
              </div>
              <div class="tooltip-body" id="tooltipBody"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- جدول اطلاعات -->
      <div class="row">
        <div class="col-12">
          <div class="info-container">
            <div id="info-table" class="text-center"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="{% static 'vendors/bundle.js' %}"></script>
    <!-- end::global scripts -->

    <!-- begin::custom scripts -->
    <script src="{% static 'assets/js/custom.js' %}"></script>
    <script src="{% static 'assets/js/app.min.js' %}"></script>
    <script src="{% static 'vendors/select2/js/select2.min.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- آیکون‌های Font Awesome -->
    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js" crossorigin="anonymous"></script>

    <script>
        // Global variables
        let root;
        let i = 0;
        const duration = 750;
        
        const svg = d3.select("svg"),
              width = +svg.attr("width"),
              height = +svg.attr("height"),
              g = svg.append("g").attr("transform", "translate(40,0)");
    
        const tree = d3.tree().size([height, width - 200]);
        
        // Tooltip elements
        const tooltip = document.getElementById('nodeTooltip');
        const tooltipHeader = document.getElementById('tooltipHeader');
        const tooltipBody = document.getElementById('tooltipBody');
        const loadingOverlay = document.getElementById('loadingOverlay');
        
        function showLoading() {
          loadingOverlay.classList.add('active');
        }
        
        function hideLoading() {
          loadingOverlay.classList.remove('active');
        }
    
        function fetchData() {
          const moshakhaseId = document.getElementById('moshakhase').value;
          console.log(moshakhaseId,'!!!!!!!!!!!!');
            // غیرفعال کردن دکمه اکسل تا زمانی که داده‌های جدید لود شوند
          document.getElementById('exportBtn').disabled = true;
          // نمایش loading
          showLoading();
    
          fetch(`/api/production-graph/?moshakhase_id=${moshakhaseId}`)
            .then(response => response.json())
            .then(data => {
              if (data.error) {
                console.error(data.error);
                return;
              }
              initializeTree(data.data);
              showTable(root);
              enableExportButton(); // فعال کردن دکمه اکسل بعد از لود داده‌ها
            })
            .catch(error => console.error('Error fetching data:', error))
            .finally(() => {
              // بازگرداندن دکمه به حالت اول و مخفی کردن loading
              hideLoading();
            });
        }
        
        function showTooltip(event, d) {
          const info = d.data.productionInfo || { 
            production: "نامشخص", 
            speed: "نامشخص", 
            wastage: "نامشخص",
            first_day: "نامشخص",
            last_day: "نامشخص",
            first_timestamp: "نامشخص",
            last_timestamp: "نامشخص",
            distinct_days: 0
          };
          
          tooltipHeader.innerHTML = `<i class="fas fa-chart-bar me-2"></i>اطلاعات تولید: ${d.data.name}`;
          
          tooltipBody.innerHTML = `
            <table class="table table-sm table-hover table-bordered">
              <thead class="table-light">
                <tr>
                  <th><i class="fa fa-list me-2"></i>پارامتر</th>
                  <th><i class="fa fa-chart-line me-2"></i>مقدار</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><i class="fa fa-box me-2"></i>مقدار تولید</td>
                  <td><span class="badge bg-success">${info.production}</span></td>
                </tr>
                <tr>
                  <td><i class="fa fa-tachometer-alt me-2"></i>سرعت</td>
                  <td><span class="badge bg-info">${info.speed}</span></td>
                </tr>
                <tr>
                  <td><i class="fa fa-trash me-2"></i>ضایعات</td>
                  <td><span class="badge bg-warning">${info.wastage}</span></td>
                </tr>
                <tr>
                  <td><i class="fa fa-calendar-day me-2"></i>اولین روز تولید (شمسی)</td>
                  <td>${info.first_day}</td>
                </tr>
                <tr>
                  <td><i class="fa fa-calendar-check me-2"></i>آخرین روز تولید (شمسی)</td>
                  <td>${info.last_day}</td>
                </tr>
                <tr>
                  <td><i class="fas fa-clock me-2"></i>اولین زمان ثبت (شمسی)</td>
                  <td>${info.first_timestamp}</td>
                </tr>
                <tr>
                  <td><i class="fas fa-stopwatch me-2"></i>آخرین زمان ثبت (شمسی)</td>
                  <td>${info.last_timestamp}</td>
                </tr>
                <tr>
                  <td><i class="fas fa-calendar-alt me-2"></i>تعداد روزهای تولید</td>
                  <td><span class="badge bg-primary">${info.distinct_days} روز</span></td>
                </tr>
              </tbody>
            </table>
          `;
          
          // Get the container and mouse position
          const container = tooltip.parentElement;
          const containerRect = container.getBoundingClientRect();
          
          // Get mouse position relative to container
          const mouseX = event.pageX - containerRect.left - window.scrollX;
          const mouseY = event.pageY - containerRect.top - window.scrollY;
          
          // Show tooltip to get dimensions
          tooltip.style.display = 'block';
          tooltip.style.opacity = '0';
          const tooltipRect = tooltip.getBoundingClientRect();
          
          // Calculate position
          let left = mouseX + 20;
          let top = mouseY - tooltipRect.height / 2;
          
          const arrow = tooltip.querySelector('.tooltip-arrow');
          arrow.className = 'tooltip-arrow left';
          
          // Check if tooltip goes out of bounds on the right
          if (left + tooltipRect.width > containerRect.width - 20) {
            // Position to the left instead
            left = mouseX - tooltipRect.width - 20;
            arrow.className = 'tooltip-arrow right';
          }
          
          // Check vertical bounds
          if (top < 20) {
            top = 20;
          } else if (top + tooltipRect.height > containerRect.height - 20) {
            top = containerRect.height - tooltipRect.height - 20;
          }
          
          tooltip.style.left = left + 'px';
          tooltip.style.top = top + 'px';
          tooltip.style.opacity = '1';
          tooltip.classList.add('show');
          
          // Add click outside listener
          document.addEventListener('click', handleClickOutside);
        }
        
        function hideTooltip() {
          tooltip.classList.remove('show');
          tooltip.style.display = 'none';
          // Remove click outside listener
          document.removeEventListener('click', handleClickOutside);
        }
        
        function handleClickOutside(event) {
          if (!tooltip.contains(event.target) && !event.target.closest('.node')) {
            hideTooltip();
          }
        }
    
        function showTable(d) {
          const info = d.data.productionInfo || { 
            production: "نامشخص", 
            speed: "نامشخص", 
            wastage: "نامشخص",
            first_day: "نامشخص",
            last_day: "نامشخص",
            first_timestamp: "نامشخص",
            last_timestamp: "نامشخص",
            distinct_days: 0
          };
          
          const table = `
            <div class="table-responsive">
              <h5 class="mb-4 text-primary">
                <i class="fas fa-chart-bar me-2"></i>اطلاعات تولید: ${d.data.name}
              </h5>
              <table class="table table-hover table-bordered">
                <thead class="table-primary">
                  <tr>
                    <th><i class="fas fa-list me-2"></i>پارامتر</th>
                    <th><i class="fas fa-chart-line me-2"></i>مقدار</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td><i class="fas fa-box me-2"></i>مقدار تولید</td>
                    <td><span class="badge bg-success">${info.production}</span></td>
                  </tr>
                  <tr>
                    <td><i class="fas fa-tachometer-alt me-2"></i>سرعت</td>
                    <td><span class="badge bg-info">${info.speed}</span></td>
                  </tr>
                  <tr>
                    <td><i class="fas fa-trash me-2"></i>ضایعات</td>
                    <td><span class="badge bg-warning">${info.wastage}</span></td>
                  </tr>
                  <tr>
                    <td><i class="fas fa-calendar-day me-2"></i>اولین روز تولید (شمسی)</td>
                    <td>${info.first_day}</td>
                  </tr>
                  <tr>
                    <td><i class="fas fa-calendar-check me-2"></i>آخرین روز تولید (شمسی)</td>
                    <td>${info.last_day}</td>
                  </tr>
                  <tr>
                    <td><i class="fas fa-clock me-2"></i>اولین زمان ثبت (شمسی)</td>
                    <td>${info.first_timestamp}</td>
                  </tr>
                  <tr>
                    <td><i class="fas fa-stopwatch me-2"></i>آخرین زمان ثبت (شمسی)</td>
                    <td>${info.last_timestamp}</td>
                  </tr>
                  <tr>
                    <td><i class="fas fa-calendar-alt me-2"></i>تعداد روزهای تولید</td>
                    <td><span class="badge bg-primary">${info.distinct_days} روز</span></td>
                  </tr>
                </tbody>
              </table>
            </div>
          `;
          d3.select("#info-table").html(table);
        }
    
        function initializeTree(data) {
          // Clear previous tree
          g.selectAll("*").remove();
          
          root = d3.hierarchy(data);
          root.x0 = height / 2;
          root.y0 = 0;
    
          // Initialize nodes with IDs and store original children
          root.eachBefore((d, i) => {
            d.id = i;
            if (d.children) {
              d._children = d.children.slice(); // Store original children
            }
          });
    
          // Collapse nodes deeper than level 2 by default
          function collapseDeepNodes(d) {
            if (d.depth >= 1 && d.children) {
              d._children = d.children;
              d.children = null;
            }
            if (d.children) {
              d.children.forEach(collapseDeepNodes);
            }
          }
    
          collapseDeepNodes(root);
    
          update(root);
        }
    
        function collapse(d) {
          if (d.children) {
            d._children = d.children;
            d._children.forEach(collapse);
            d.children = null;
          }
        }
    
        function click(event, d) {
          if (d.children) {
            d._children = d.children;
            d.children = null;
          } else if (d._children) {
            d.children = d._children;
            d._children = null;
          }
          update(d);
          showTable(d);
        }
    
        function update(source) {
          // Compute the new tree layout
          const treeData = tree(root);
          const nodes = treeData.descendants();
          const links = treeData.descendants().slice(1);
    
          // Normalize for fixed-depth
          nodes.forEach(d => { d.y = d.depth * 250; });
    
          // ****************** Nodes section ***************************
    
          // Update the nodes...
          const node = g.selectAll('g.node')
              .data(nodes, d => d.id);
    
          // Enter any new modes at the parent's previous position.
          const nodeEnter = node.enter().append('g')
              .attr('class', 'node')
              .attr("transform", d => "translate(" + source.y0 + "," + source.x0 + ")")
              .on('click', click)
              .on('mouseenter', function(event, d) {
                showTooltip(event, d);
              })
              .on('mouseleave', hideTooltip);
    
          // Add Circle for the nodes
          nodeEnter.append('circle')
              .attr('r', 1e-6)
              .style("fill", d => d._children ? "#20c997" : "#fff");
    
          // Add labels for the nodes
          nodeEnter.append('text')
              .attr("dy", ".35em")
              .attr("x", 50)
              .attr("text-anchor", "start")
              .text(d => d.data.name);
    
          // UPDATE
          const nodeUpdate = nodeEnter.merge(node);
    
          // Transition to the proper position for the node
          nodeUpdate.transition()
            .duration(duration)
            .attr("transform", d => "translate(" + d.y + "," + d.x + ")");
    
          // Update the node attributes and style
          nodeUpdate.select('circle')
            .attr('r', 8)
            .style("fill", d => d._children ? "#20c997" : "#fff")
            .attr('cursor', 'pointer');
    
          // Remove any exiting nodes
          const nodeExit = node.exit().transition()
              .duration(duration)
              .attr("transform", d => "translate(" + source.y + "," + source.x + ")")
              .remove();
    
          // On exit reduce the node circles size to 0
          nodeExit.select('circle')
            .attr('r', 1e-6);
    
          // On exit reduce the opacity of text labels
          nodeExit.select('text')
            .style('fill-opacity', 1e-6);
    
          // ****************** links section ***************************
    
          // Update the links...
          const link = g.selectAll('path.link')
              .data(links, d => d.id);
    
          // Enter any new links at the parent's previous position.
          const linkEnter = link.enter().insert('path', "g")
              .attr("class", "link")
              .attr('d', d => {
                const o = {x: source.x0, y: source.y0}
                return diagonal(o, o)
              });
    
          // UPDATE
          const linkUpdate = linkEnter.merge(link);
    
          // Transition back to the parent element position
          linkUpdate.transition()
              .duration(duration)
              .attr('d', d => diagonal(d, d.parent));
    
          // Remove any exiting links
          const linkExit = link.exit().transition()
              .duration(duration)
              .attr('d', d => {
                const o = {x: source.x, y: source.y}
                return diagonal(o, o)
              })
              .remove();
    
          // Store the old positions for transition.
          nodes.forEach(d => {
            d.x0 = d.x;
            d.y0 = d.y;
          });
    
          // Creates a curved (diagonal) path from parent to the child nodes
          function diagonal(s, d) {
            const path = `M ${s.y} ${s.x}
                    C ${(s.y + d.y) / 2} ${s.x},
                      ${(s.y + d.y) / 2} ${d.x},
                      ${d.y} ${d.x}`
            return path
          }
        }
    
        // توابع مربوط به select2 بدون تغییر باقی می‌مانند...
        function initiate_code_nakh(){
          $('.nakh-name').select2({
            dropdownParent: $('body'),
            ajax: {
                url: '/api/moshakhase/search/',
                dataType: 'json',
                delay: 250,
                data: function (params) {
                    return {
                        q: params.term,
                        page: params.page || 1
                    };
                },
                processResults: function (data, params) {
                    params.page = params.page || 1;
                    
                    return {
                        results: data.results.map(function(item) {
                            return {
                                id: item.id,
                                text: item.name + ' (' + item.color_name + ')',
                                name: item.name,
                                color_id: item.color_id,
                                color_name: item.color_name,
                                tool: item.tool,
                                la: item.la
                            };
                        }),
                        pagination: {
                            more: data.has_more
                        }
                    };
                },
                cache: true
            },
            minimumInputLength: 2,
            language: {
                inputTooShort: function () {
                    return "حداقل 2 کاراکتر وارد کنید";
                },
                searching: function () {
                    return "در حال جستجو...";
                },
                noResults: function () {
                    return "نتیجه‌ای یافت نشد";
                },
                errorLoading: function () {
                    return "خطا در بارگذاری نتایج";
                }
            },
            dir: "rtl"
          });
          
          $('.nakh-name').on('select2:select', function (e) {
              var data = e.params.data;
              var $row = $(this).closest('div');    
              updateOperatorHiddenFields2($row);    
              console.log('Selected operator:', data);
          });
          
          $('.nakh-name').on('select2:unselect', function (e) {
              var data = e.params.data;
              var $row = $(this).closest('div');
              updateOperatorHiddenFields2($row);
              console.log('Unselected operator:', data);
          });
          
          $('.nakh-name').on('select2:clear', function (e) {
              var $row = $(this).closest('div');
              $row.find('.nakh-data').val('');
          });
        }
        
        function updateOperatorHiddenFields2($row) {
          var selectedOperators = $row.find('.nakh-name').select2('data')[0];
          console.log(selectedOperators);
          
          var updatedOperators = {
            id: selectedOperators.id,
            text: selectedOperators.name + ' (' + selectedOperators.color_name + ')',
            name: selectedOperators.name,
            color_id: selectedOperators.pid,
            color_name: selectedOperators.cp_code,
            tool: selectedOperators.tool,
            la: selectedOperators.la
          };
          
          $row.find('.nakh-data').val(JSON.stringify(updatedOperators));
        }
        function exportToExcel() {
            if (!root) {
                alert('داده‌ای برای خروجی وجود ندارد');
                return;
            }
            
            // نمایش loading
            showLoading();
            
            try {
                // جمع‌آوری داده‌ها از تمام نودها
                const allData = collectAllNodeData(root);
                
                // ایجاد workbook و worksheet
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(allData);
                
                // تنظیم نام worksheet
                XLSX.utils.book_append_sheet(wb, ws, "داده‌های تولید");
                
                // تنظیم عرض ستون‌ها
                const colWidths = [
                    {wch: 25}, // نام
                    {wch: 15}, // سطح
                    {wch: 20}, // مقدار تولید
                    {wch: 15}, // سرعت
                    {wch: 20}, // ضایعات
                    {wch: 15}, // اولین روز
                    {wch: 15}, // آخرین روز
                    {wch: 20}, // اولین زمان ثبت
                    {wch: 20}, // آخرین زمان ثبت
                    {wch: 15}  // تعداد روزها
                ];
                ws['!cols'] = colWidths;
                
                // تولید فایل و دانلود
                const moshakhaseName = document.getElementById('moshakhase').options[document.getElementById('moshakhase').selectedIndex]?.text || 'داده‌ها';
                const fileName = `داده_های_تولید_${moshakhaseName.replace(/[^\w\u0600-\u06FF]/g, '_')}_${new Date().toLocaleDateString('fa-IR')}.xlsx`;
                
                XLSX.writeFile(wb, fileName);
                
            } catch (error) {
                console.error('خطا در تولید فایل اکسل:', error);
                alert('خطا در تولید فایل اکسل');
            } finally {
                // مخفی کردن loading
                hideLoading();
            }
        }

        // تابع کمکی برای جمع‌آوری داده‌های تمام نودها
        function collectAllNodeData(node) {
            const data = [];
            
            function traverse(currentNode, level = 0) {
                const info = currentNode.data.productionInfo || {};
                
                // اضافه کردن داده‌های نود فعلی
                data.push({
                    'نام': currentNode.data.name,
                    'سطح': getLevelName(level),
                    'مقدار تولید (کیلوگرم)': extractNumber(info.production),
                    'سرعت (متر/دقیقه)': extractNumber(info.speed),
                    'ضایعات (کیلوگرم)': extractNumber(info.wastage),
                    'اولین روز تولید': info.first_day || 'نامشخص',
                    'آخرین روز تولید': info.last_day || 'نامشخص',
                    'اولین زمان ثبت': info.first_timestamp || 'نامشخص',
                    'آخرین زمان ثبت': info.last_timestamp || 'نامشخص',
                    'تعداد روزهای تولید': info.distinct_days || 0
                });
                
                // اگر فرزندان باز هستند، آنها را نیز اضافه کن
                if (currentNode.children) {
                    currentNode.children.forEach(child => {
                        traverse(child, level + 1);
                    });
                }
                // اگر فرزندان بسته هستند اما در _children ذخیره شده‌اند
                else if (currentNode._children) {
                    currentNode._children.forEach(child => {
                        traverse(child, level + 1);
                    });
                }
            }
            
            traverse(node);
            return data;
        }

        // تابع کمکی برای استخراج عدد از رشته
        function extractNumber(str) {
            if (!str || str === 'نامشخص') return 0;
            const match = str.match(/[\d.]+/);
            return match ? parseFloat(match[0]) : 0;
        }

        // تابع کمکی برای نام سطح
        function getLevelName(level) {
            const levels = ['ریشه', 'دسته‌بندی', 'دستگاه', 'زیردستگاه'];
            return levels[level] || `سطح ${level + 1}`;
        }

        // فعال کردن دکمه اکسل وقتی داده‌ها لود شدند
        function enableExportButton() {
            document.getElementById('exportBtn').disabled = false;
        }
        
        initiate_code_nakh();
    </script>
